########################### Default parameters ######################
logo = "images/logo.png"
logo_width = "80px"
logo_footer = "images/logo.png"
favicon = "images/favicon.png"
page_sharing_image = "images/backgrounds/schools-GitHub-Education-sharing.jpeg"
# top header
top_header = true
# Meta data
description = "GitHub Education TNTU"
author = "GitHub Education TNTU"
# Footer content
footer_content = "GitHub Education допомагає студентам, викладачам та школам отримати доступ до інструментів та ресурсів для навчання та розвитку."

# contact form action
contact_form_action = "#" # contact form works with https://formspree.io

# Google Tag Manager
gtm = "" # GTM-XXXXXXXX

# Global date parameters
year = 2026
cookie_consent = false
deployed_git_tag = "local-version"

# page sidebar quick contact form
quick_contact = true
# search
search = false

# Main section
mainSections = ["blog"]

# Preloader
[preloader]
enable = false
preloader = "" # use jpg, png, svg or gif format.

# Navigation button
[navigation_button]
enable = false
label = "get a quote"
link = "#contacts"

# Subscription
[subscription]
enable = false
# mailchimp subsciption
mailchimp_form_action = "https://gmail.us4.list-manage.com/subscribe/post?u=463ee871f45d2d93748e77cad&amp;id=a0a2c6d074" # replace this url with yours
mailchimp_form_name = "b_463ee871f45d2d93748e77cad_a0a2c6d074" # replace this code with yours

# google map
[gmap]
enable = false
gmap_api = "AIzaSyCcABaamniA6OL5YvYSpB3pFMNrXwXnLwU"
