<div class="event-item mb-5">
  <div class="position-relative mb-4 overflow-hidden">
    <a href="{{ .Permalink }}">
      <img loading="lazy" src="{{ .Params.Image_webp | absURL }}"
           onerror="this.onerror=null;this.src='{{.Params.Image | absURL }}'" alt="Image of  {{ .Title }}"
           class="img-fluid w-100">
    </a>
  </div>
  {{ "<!-- event-info --> " | safeHTML }}
  <div class="px-4">
    <h6 class="text-primary">{{ .Params.Category }}</h6>
    <h4><a class="text-dark" href="{{ .Permalink }}" aria-label="event details">{{ .Title }}</a></h4>
    <p class="text-muted mb-0"><i class="fas fa-calendar-alt mr-2"></i>{{ .Params.event_date }}</p>
    {{ if .Params.location }}
    <p class="text-muted"><i class="fas fa-map-marker-alt mr-2"></i>{{ .Params.location }}</p>
    {{ end }}
  </div>
</div>
